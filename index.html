<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassPredict — Academic Analytics & SGPA Prediction</title>
  <meta name="description" content="Privacy-first academic performance analytics, numerical-methods education, and next-semester SGPA prediction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
</head>
<body data-app-shell>
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Application navigation">
      <div class="app-sidebar-brand-row">
        <a href="#" class="cp-brand" id="brand-home-sidebar" data-nav-id="dashboard" aria-label="ClassPredict overview">
          <span class="cp-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>ClassPredict</strong><small>Academic Analytics</small></span>
        </a>
        <button class="cp-icon-button sidebar-toggle-close" id="sidebar-toggle-close" aria-label="Close navigation">×</button>
      </div>
      <nav class="cp-sidebar-nav" aria-label="Main navigation">
        <p class="cp-nav-eyebrow">Workspace</p>
        <button class="cp-nav-item nav-link is-active" id="tab-btn-dashboard" data-nav-id="dashboard" data-tab="dashboard" aria-current="page"><span class="cp-nav-symbol">01</span>Overview</button>
        <button class="cp-nav-item nav-link" id="tab-btn-dataset" data-nav-id="dataset" data-tab="dataset"><span class="cp-nav-symbol">02</span>Dataset Management</button>
        <button class="cp-nav-item nav-link" id="tab-btn-predictions" data-nav-id="individual" data-tab="predictions" data-prediction-mode="individual"><span class="cp-nav-symbol">03</span>Individual Prediction</button>
        <button class="cp-nav-item nav-link" data-nav-id="class" data-tab="predictions" data-prediction-mode="class"><span class="cp-nav-symbol">04</span>Whole-Class Prediction</button>
        <button class="cp-nav-item nav-link" id="tab-btn-ocr" data-nav-id="ocr" data-tab="ocr"><span class="cp-nav-symbol">05</span>OCR Review</button>
        <button class="cp-nav-item nav-link" data-nav-id="lab" data-tab="lab"><span class="cp-nav-symbol">06</span>Numerical Methods Lab</button>
      </nav>
      <div class="app-sidebar-footer">
        <button class="app-dataset-status" id="sidebar-dataset-widget" data-nav-id="dataset" type="button">
          <span class="cp-status-dot is-empty"></span>
          <span><strong>Session memory</strong><small>No dataset loaded</small></span>
        </button>
        <p class="cp-privacy-note"><span aria-hidden="true">▣</span><span><strong>Privacy first</strong><small>Academic records remain in this browser session.</small></span></p>
      </div>
    </aside>
    <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="Close navigation"></button>
    <div class="app-main">
      <header class="app-topbar">
        <button class="cp-icon-button sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Open navigation">☰</button>
        <div class="app-page-context"><span class="cp-kicker">ClassPredict workspace</span><strong id="page-breadcrumb-title">Overview</strong></div>
        <div class="app-topbar-actions">
          <button class="cp-button cp-button-ghost cp-button-sm" id="btn-header-demo" type="button">Synthetic demo</button>
          <button class="app-topbar-status" id="topbar-dataset-status" data-nav-id="dataset" type="button"><span class="cp-status-dot is-empty"></span><span>No dataset</span></button>
        </div>
      </header>
      <main class="content-canvas" id="main-content"><div class="container"><div id="view-container" aria-live="polite"></div></div></main>
      <footer class="app-footer"><div class="footer-inner"><span>ClassPredict · Numerical Methods Capstone</span><span>Client-side processing · Ephemeral session data</span></div></footer>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
