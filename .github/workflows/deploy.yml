name: Deploy ClassPredict to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Automated Verification Test Suite
        run: npm test

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage Production Website Artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp sw.js _site/
          cp -r css _site/
          cp -r js _site/
          cp -r samples _site/
          cp -r docs _site/
          touch _site/.nojekyll

      - name: Upload Static Application Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
